# Workflow для сборки и деплоя React + Vite проекта на GitHub Pages
name: Deploy React site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Устанавливаем Node.js, без него React не соберется
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. Устанавливаем все библиотеки (папку node_modules)
      - name: Install dependencies
        run: npm ci

      # 3. Компилируем проект (создается папка dist с чистым HTML/JS/CSS)
      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 4. ВАЖНО: загружаем ТОЛЬКО папку dist, а не весь проект!
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

      # 5. Публикуем собранный сайт
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
